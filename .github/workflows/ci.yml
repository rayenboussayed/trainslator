name: ci
on:
  push:
    branches: [main]
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The changed-file coverage gate needs the PR base / previous commit
          # to exist locally so the pushed diff can be staged (see the gate step).
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          postgres: 'true'
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - name: verify generated API artifacts are current
        run: |
          npm run generate:api
          git diff --exit-code -- generated/ apps/api/test/fixtures/openapi.golden.json
      - run: npm run test:cov
      - name: drizzle migration consistency check
        run: npm run db:check
      - name: drizzle migration drift check
        run: npm run db:generate --workspace=@trainslator/api
      - name: ensure generated migrations are committed
        run: git diff --exit-code -- apps/api/drizzle
      - run: npm run knip
      - run: npm audit --omit=dev --audit-level=high
      - name: changed-file coverage gate (CI only; not in check or husky)
        # Skip the gate when the diff touches no authored source file. The
        # pathspecs below mirror vitest.config.mts coverage include/exclude, so
        # a docs-only change cannot hide a real source change or fail the 100%
        # per-file guard. For source changes, bare `--changed` only sees staged
        # files and a CI checkout is clean, so move HEAD to the base to stage
        # the pushed/PR diff, which is exactly what `vitest --changed` reads.
        # Clear the summary from the earlier full run so the guard below cannot
        # read stale totals.
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          case "$BASE" in
            ''|0000000000000000000000000000000000000000) BASE=HEAD~1 ;;
          esac
          CHANGED="$(git diff --name-only "$BASE"...HEAD -- \
            ':(glob)apps/api/src/**/*.ts' \
            ':(glob)apps/web/src/**/*.ts' \
            ':(glob)apps/web/src/**/*.tsx' \
            ':(exclude,glob)**/*.spec.ts' \
            ':(exclude,glob)**/*.test.ts' \
            ':(exclude,glob)**/*.test.tsx' \
            ':(exclude,glob)**/*.d.ts' \
            ':(exclude,glob)apps/web/src/routeTree.gen.ts' \
            ':(exclude,glob)generated/**')"
          if [ -z "$CHANGED" ]; then
            echo "changed-file coverage: no authored source changes, skipping gate"
            exit 0
          fi
          git reset --soft "$BASE"
          rm -f coverage/coverage-summary.json
          npm run test:cov:changed
          node scripts/assert-changed-coverage.mjs
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          postgres: 'true'
      - run: npm run build
      - run: npm run test:e2e
  perf:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          postgres: 'false'
      - run: npm run test:perf
  mem:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          postgres: 'false'
      - run: npm run test:mem
